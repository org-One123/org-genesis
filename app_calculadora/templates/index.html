{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma Interactiva</title>
    <link rel="stylesheet" href="{% static 'app_calculadora/style.css' %}">
</head>
<body>
    <div class="card">
        <h1>Suma de 2 Números</h1>
        
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label for="num1">Primer número:</label>
                <input type="number" id="num1" name="num1" placeholder="Ej: 15" value="{{ num1|default:'0' }}" step="any" required>
            </div>
            
            <div class="input-group">
                <label for="num2">Segundo número:</label>
                <input type="number" id="num2" name="num2" placeholder="Ej: 25" value="{{ num2|default:'0' }}" step="any" required>
            </div>

            <button type="submit" id="btnSumar">Sumar</button>
        </form>

        <div class="resultado-container">
            <div class="resultado-label">Resultado:</div>
            <div id="resultado" class="resultado-valor">
                {% if resultado is not None %}
                    {{ resultado }}
                {% else %}
                    0
                {% endif %}
            </div>
        </div>
    </div>

    <script src="{% static 'app_calculadora/script.js' %}"></script>
</body>
</html>
