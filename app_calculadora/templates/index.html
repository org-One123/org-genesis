{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCalc v2.0 - Geolocalización & Multimedia</title>
    
    <!-- Favicon del sistema -->
    <link rel="icon" type="image/x-icon" href="{% static 'imagenes/sistemas/favicon.ico' %}">

    <!-- Fuentes estilo Gaming / Sci-Fi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet Maps CSS (CDN) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Estilo CSS local único -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=6">
</head>
<body>
    <!-- Fondo cibernético -->
    <div class="background-grid"></div>

    <div class="card">
        <div class="card-header">
            <span class="status-badge">
                <img src="{% static 'imagenes/iconos/2.svg' %}" alt="Icono" class="header-icon"> 
                // SYSTEM ONLINE - MULTIMEDIA & GPS
            </span>
            <h1>CYBER CALC v2</h1>
        </div>
        
        <!-- Módulo de Calculadora -->
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label for="num1"><span>#01</span> PRIMER NÚMERO</label>
                <input type="number" id="num1" name="num1" placeholder="00" value="{{ num1|default:'0' }}" step="any" required autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="num2"><span>#02</span> SEGUNDO NÚMERO</label>
                <input type="number" id="num2" name="num2" placeholder="00" value="{{ num2|default:'0' }}" step="any" required autocomplete="off">
            </div>

            <button type="submit" id="btnSumar" class="btn-gamer">
                ► CALCULAR SUMA
            </button>
        </form>

        <div class="resultado-container">
            <div class="resultado-label">[OUTPUT] RESULTADO FINAL</div>
            <div id="resultado" class="resultado-valor">
                {% if resultado is not None %}
                    {{ resultado }}
                {% else %}
                    0
                {% endif %}
            </div>
        </div>

        <!-- Módulo de Mapa y Geolocalización -->
        <div class="mapa-section">
            <div class="input-group">
                <label>📍 SELECCIONAR RUTA TURÍSTICA</label>
                <select id="select-rutas">
                    <!-- Se llena con mapa.js -->
                </select>
            </div>

            <div class="input-group">
                <label>COORDENADA ORIGEN</label>
                <input type="text" id="coord-origen" readonly>
            </div>

            <div class="input-group">
                <label>COORDENADA DESTINO</label>
                <input type="text" id="coord-destino" readonly>
            </div>

            <div class="btn-group">
                <button type="button" id="btn-trazar-seleccion" class="btn-secundario">🗺️ TRAZAR RUTA</button>
                <button type="button" id="btn-limpiar" class="btn-secundario">❌ LIMPIAR MAPA</button>
            </div>

            <!-- Contenedor del Mapa -->
            <div id="mapa"></div>
        </div>

        <!-- Galería de Imágenes -->
        <!-- Galería de Imágenes -->
        <div class="media-section">
            <div class="section-title">🖼️ GALERÍA DE IMÁGENES</div>
            <div class="media-grid">
                <img src="{% static 'imagenes/fotos/4.jpg' %}" alt="Foto 4" class="media-img">
                <img src="{% static 'imagenes/sistemas/8.jpg' %}" alt="Foto 8" class="media-img">
                <img src="{% static 'imagenes/fotos/6.jpg' %}" alt="Foto 6" class="media-img">
                <img src="{% static 'imagenes/fotos/7.jpg' %}" alt="Foto 7" class="media-img">
            </div>
        </div>
        <!-- Sección de Videos -->
        <div class="media-section">
            <div class="section-title">🎬 VIDEOS DEMOSTRATIVOS</div>
            <div class="video-container">
                <video controls preload="metadata">
                    <source src="{% static 'videos/clips/KOCMOC UNLEASHED.mp4' %}" type="video/mp4">
                    Tu navegador no soporta el reproductor de video.
                </video>
            </div>
        </div>
    </div>

    <!-- Leaflet Maps JS (CDN) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Scripts locales -->
    <script src="{% static 'scripts/mapa.js' %}"></script>
    <script src="{% static 'scripts/puntos_encuentro.js' %}"></script>
    <script src="{% static 'scripts/sismos_api.js' %}"></script>
    <script src="{% static 'scripts/tabla_csv.js' %}"></script>
</body>
</html>
