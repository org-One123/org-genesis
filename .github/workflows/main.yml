name: Ejecutar Suma en Push

on:
  push:
    branches:
      - main
      - develop

jobs:
  ejecutar-suma:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de suma
        run: python src/suma.py
