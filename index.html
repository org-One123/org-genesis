<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma Interactiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Suma de 2 Números</h1>
        
        <div class="input-group">
            <label for="num1">Primer número:</label>
            <input type="number" id="num1" placeholder="Ej: 15" value="0">
        </div>
        
        <div class="input-group">
            <label for="num2">Segundo número:</label>
            <input type="number" id="num2" placeholder="Ej: 25" value="0">
        </div>

        <button id="btnSumar">Sumar</button>

        <div class="resultado-container">
            <div class="resultado-label">Resultado:</div>
            <div id="resultado" class="resultado-valor">0</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
